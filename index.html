<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hər Gün Ərəbcə</title>
    <style>
        /* Bütün stillər əvvəlki kodda olduğu kimi, heç bir dəyişiklik yoxdur */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #0F5973, #134467, #0E223B);
            min-height: 100vh;
            color: white;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { max-width: 28rem; width: 100%; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 24px; padding-top: 16px; }
        .header h1 {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 4px;
            color: #FFFFFF;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .glass-card {
            background: rgba(255,255,255,0.10);
            border: 1px solid rgba(255,255,255,0.20);
            border-radius: 36px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 24px;
            margin-bottom: 24px;
        }
        .glass-button {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 16px;
            padding: 16px;
            font-size: 1.125rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: background 0.3s ease;
            width: 100%;
            text-align: center;
        }
        .glass-button:hover { background: rgba(255,255,255,0.25); }
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        .arabic-text {
            font-family: 'Traditional Arabic', 'Scheherazade New', 'Amiri', serif;
            font-size: 1.8rem;
            line-height: 2.2rem;
            direction: rtl;
            text-align: right;
            unicode-bidi: isolate;
        }
        .input-field {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            color: white;
            padding: 10px 15px;
            width: 100%;
            outline: none;
            font-size: 1rem;
        }
        .input-field:focus { border-color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.15); }
        .fade-in { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .feedback { margin-top: 12px; text-align: center; font-weight: 600; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .warning { color: #facc15; }
        .hidden { display: none; }
        .flex-between { display: flex; justify-content: space-between; align-items: flex-start; }
        .text-white-75 { color: rgba(255,255,255,0.75); }
        .text-white-50 { color: rgba(255,255,255,0.5); }
        .mt-1 { margin-top: 4px; }
        .mt-2 { margin-top: 8px; }
        .mt-3 { margin-top: 12px; }
        .mt-4 { margin-top: 16px; }
        .mb-1 { margin-bottom: 4px; }
        .mb-2 { margin-bottom: 8px; }
        .mb-3 { margin-bottom: 12px; }
        .mb-4 { margin-bottom: 16px; }
        .mb-6 { margin-bottom: 24px; }
        .text-center { text-align: center; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-3xl { font-size: 1.875rem; }
        .text-4xl { font-size: 2.25rem; }
        .font-bold { font-weight: bold; }
        .font-semibold { font-weight: 600; }
        .w-full { width: 100%; }
        .rounded-xl { border-radius: 12px; }
        .border-b { border-bottom: 1px solid rgba(255,255,255,0.1); }
        .py-2 { padding-top: 8px; padding-bottom: 8px; }
        .py-3 { padding-top: 12px; padding-bottom: 12px; }
        .px-6 { padding-left: 24px; padding-right: 24px; }
        .close-btn { background: none; border: none; color: rgba(255,255,255,0.75); font-size: 1.5rem; cursor: pointer; line-height: 1; }
        .close-btn:hover { color: white; }
        .option-label {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .option-label:hover { background: rgba(255,255,255,0.1); }
        .option-label input[type="radio"] { width: 20px; height: 20px; accent-color: #3b82f6; }
        .clickable { cursor: pointer; transition: transform 0.1s, background 0.2s; padding: 8px; border-radius: 8px; }
        .clickable:hover { background: rgba(255,255,255,0.15); }
        .clickable:active { transform: scale(0.98); }
        .telegram-footer { display: flex; justify-content: center; margin-top: 20px; margin-bottom: 10px; }
        .telegram-footer a { display: inline-block; transition: transform 0.2s; }
        .telegram-footer a:hover { transform: scale(1.1); }
        .translation-toggle {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 4px 12px;
            cursor: pointer;
            color: white;
            font-size: 0.75rem;
            transition: background 0.2s;
            display: inline-block;
            margin-bottom: 8px;
        }
        .translation-toggle:hover { background: rgba(255,255,255,0.2); }
        .dialogue-translation { display: block; direction: ltr; text-align: left; font-size: 0.875rem; color: rgba(255,255,255,0.75); }
        .translation-hidden .dialogue-translation { display: none !important; }
        .nav-row { display: flex; gap: 10px; margin-top: 12px; }
        .nav-row .glass-button { flex: 1; padding: 14px; font-size: 1rem; }
        .glass-button:disabled { opacity: 0.35; cursor: not-allowed; }
        .glass-button:disabled:hover { background: rgba(255,255,255,0.15); }
        .progress-text { text-align: center; font-size: 0.8rem; color: rgba(255,255,255,0.55); margin-bottom: 10px; }
        .correct-answer-box {
            margin-top: 8px;
            background: rgba(74,222,128,0.12);
            border: 1px solid rgba(74,222,128,0.4);
            border-radius: 10px;
            padding: 10px 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>HƏR GÜN ƏRƏBCƏ</h1>
        </div>

        <div id="main-menu" class="glass-card">
            <div class="menu-grid">
                <button id="btn-verbs" class="glass-button">🔤 Feillər</button>
                <button id="btn-dialogues" class="glass-button">💬 Dialoqlar</button>
                <button id="btn-tests" class="glass-button">📝 Testlər</button>
            </div>
            <div class="text-center mt-4 text-white-50" style="font-size: 0.75rem;">
                Öyrənilən məlumatlar yadda saxlanılır
            </div>
        </div>

        <div id="content-area" class="fade-in"></div>

        <div class="telegram-footer">
            <a href="https://t.me/arabcasoz" target="_blank" title="Telegram kanalımız">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 48 48" fill="none">
                    <circle cx="24" cy="24" r="24" fill="rgba(255,255,255,0.2)"/>
                    <path d="M33.95 14.89L30.27 32.45C30.05 33.25 29.5 33.48 28.84 33.14L23.52 29.36L21.53 31.26C21.29 31.5 21.09 31.69 20.65 31.69L20.9 26.38L29.75 18.5C30.13 18.17 29.71 17.99 29.24 18.3L17.27 25.94L12.17 24.35C11.43 24.12 11.42 23.67 12.34 23.33L31.73 15.43C32.62 15.1 33.38 15.62 33.16 16.76L31.73 15.43L33.95 14.89Z" fill="white"/>
                </svg>
            </a>
        </div>
    </div>

    <!-- Data faylları -->
    <script src="verbs.js"></script>
    <script src="dialogues.js"></script>
    <script src="tests.js"></script>
    <!-- Əsas məntiq -->
    <script src="app.js"></script>
</body>
</html>
